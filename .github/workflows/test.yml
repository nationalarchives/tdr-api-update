name: TDR Run Lambda Tests
on:
  pull_request:
  push:
    branches-ignore:
      - master
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@cd62f21505397a0dc62bda0384f0101f7ccaca2a # v0.0.54
    with:
      java-version: ${{vars.JAVA_RUNTIME}}
      repo-name: tdr-api-update
      test-command: |
        sbt test
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
